[package]
name = "ditscover-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
ditscover-core = { path = "../core" }
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
numpy = "0.29"
pythonize = "0.29"
serde_json = "1"
tracing-subscriber = "0.3"

[lints]
workspace = true
