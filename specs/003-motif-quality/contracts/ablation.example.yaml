# Ablation: ditscover variants only, both splits; decisions on validation (research R5).
# Rows left after pruning (research R8); results/ablation-003 holds the full 18-variant study.
datasets:
  - synthetic: {name: synth-varlen, split: validation, n_series: 30, n: 5000, lens: [40, 60, 80], occ: 6, stretch: 0.3, noise: 0.1, seed: 0}
  - synthetic: {name: synth-varlen, split: test, n_series: 30, n: 5000, lens: [40, 60, 80], occ: 6, stretch: 0.3, noise: 0.1, seed: 0}
  - tsmd: {name: ECG5000, split: validation, n_series: 30}
  - tsmd: {name: ECG5000, split: test, n_series: 30}
  - tsmd: {name: Fungi, split: validation, n_series: 30}
  - tsmd: {name: Fungi, split: test, n_series: 30}
  - tsmd: {name: Plane, split: validation, n_series: 30}
  - tsmd: {name: Plane, split: test, n_series: 30}
  - tsmd: {name: Mallat, split: validation, n_series: 30}
  - tsmd: {name: Mallat, split: test, n_series: 30}
  - tsmd: {name: Symbols, split: validation, n_series: 30}
  - tsmd: {name: Symbols, split: test, n_series: 30}

seeds: [0, 1, 2]
k: oracle
stats: true
save_sets: true
max_runs: 20000                      # 7 variants × 12 dataset-splits × 30 series × 3 seeds = 7 560
jobs: 5                              # quality study: parallel runs, 2 threads each
threads: 2

methods:
  - {method: ditscover, label: full}
  - {method: ditscover, label: full-loo, params: {loo: false}}
  - {method: ditscover, label: full-refine, params: {refine: 0}}
  - {method: ditscover, label: full-guarded_add, params: {guarded_add: false}}
  - {method: ditscover, label: full-seed_nn, params: {seed_nn: 0}}
  - {method: ditscover, label: full-dedupe_v2, params: {dedupe_overlap: 1.0, dedupe_shape: 0.0}}
  - {method: ditscover, label: full-labelling, params: {labels: false}}   # measured only; never deleted (FR-025)
