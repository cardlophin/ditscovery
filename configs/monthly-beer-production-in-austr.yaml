# Monthly US electric production index (1985-2018, 397 points).
# Strong 12-month seasonality (winter + summer peaks) on top of a rising trend.
seed: 69

data:
  path: data/monthly-beer-production-in-austr.csv
  column: Monthly beer production
  delimiter: ","
  header: true

preprocess:
  - nan: interpolate
  - detrend: linear
  - normalize: zscore

motif:
  min_len: 9          # ~3/4 of a year
  max_len: 15         # ~1.25 years
  max_stretch: 1.3
  min_occ: 3
  max_occ: 30         # up to ~one occurrence per year
  min_gap: 0
  min_std: 1.0e-6

distance:
  kind: zeuclid      # zeuclid | euclid | dtw | zdtw
  band: 0.1           # only used by dtw / zdtw

fitness:
  extent_q: 0.9       # extent = this quantile of leave-one-out member distances
  null_pairs: 256
  cid: false
  loo: true

ga:
  population: 200
  crossover: 0.9
  shift: 0.3
  stretch: 0.2
  add: 0.2
  remove: 0.1
  sigma_shift: 0.1
  sigma_stretch: 0.1
  scan_step: 0.125
  init_greedy: 0.5
  niche_jaccard: 0.5
  refine: 0.3
  refine_radius: 0.1
  guarded_add: true
  seed_nn: 0.4

stop:
  max_generations: 300
  min_generations: 100
  time_budget_s: 60
  stagnation_window: 50
  stagnation_delta: 1.0e-3

output:
  dir: results/monthly-beer-production-in-austr
  top_k: 5            # or auto: every motif with a positive margin
  dedupe_overlap: 0.5
  dedupe_shape: 0.3
  labels: true
  snapshot_every: 10

log:
  level: info
  log_every: 10
  history: true
  channel_capacity: 1024
