seed: 42
data:
  path: data/kaggle-electric-production.csv
  column: IPG2211A2N
  delimiter: ','
  header: true
preprocess:
- nan: interpolate
- detrend: linear
- normalize: zscore
motif:
  min_len: 9
  max_len: 15
  max_stretch: 1.3
  min_occ: 3
  max_occ: 30
  min_gap: 0
  min_std: 1e-6
distance:
  kind: dtw
  band: 0.1
ga:
  population: 200
  crossover: 0.9
  shift: 0.3
  stretch: 0.2
  add: 0.2
  remove: 0.1
  sigma_shift: 0.1
  sigma_stretch: 0.1
  scan_step: 0.125
  init_greedy: 0.5
  niche_jaccard: 0.5
stop:
  max_generations: 300
  time_budget_s: 60.0
  stagnation_window: 40
  stagnation_delta: 0.0001
output:
  dir: results/electric-production
  top_k: 5
  dedupe_jaccard: 0.3
  snapshot_every: 10
log:
  level: info
  log_every: 10
  history: true
  channel_capacity: 1024
